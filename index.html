<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;color:#7a5238;font-family:'Cormorant Garamond',Georgia,serif;background:radial-gradient(ellipse at 50% 25%,#fffaf0,#f5e5d1 65%,#ead3b9)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:14px;border:1px solid rgba(122,82,56,.22);border-radius:8px;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #c98f6a;outline-offset:4px;border-radius:6px}
.top{position:relative;height:3.2rem;width:min(92vw,420px);z-index:2}
.top p{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .9s,transform .9s}
#title{font-style:italic;font-weight:500;font-size:clamp(1.6rem,6.4vw,2.1rem);letter-spacing:.03em;animation:fade 1.8s .2s both}
#hint{font-family:Caveat,cursive;font-size:1.7rem;opacity:0;color:#8a5e3c}
.top.o #title{opacity:0;transform:translateY(-8px)}
.top.h #hint{opacity:1}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.stage{--w:min(92vw,400px,calc(60dvh*.8));position:relative;width:var(--w);height:calc(var(--w)*1.25)}
.gift{position:absolute;left:50%;bottom:6%;width:72%;transform:translateX(-50%);z-index:3;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .9s;animation:fade 1.6s .5s both}
.gift svg{display:block;width:100%;overflow:visible;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(74,44,29,.18))}
@keyframes bob{50%{transform:translateY(-6px)}}
.lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .95s cubic-bezier(.4,0,.2,1),opacity .8s .15s}
.open .gift svg{animation:none}
.open .lid{transform:translate(-34px,-110px) rotate(-22deg);opacity:0}
.open .gift{pointer-events:none}
.settled .gift{transform:translateX(-50%) translateY(36px) scale(.92);opacity:0}
.bq{position:absolute;left:50%;bottom:11%;width:84%;z-index:2;opacity:0;transform:translateX(-50%) translateY(34%) scale(.5);transform-origin:50% 100%;transition:transform 1.5s cubic-bezier(.2,.9,.25,1) .5s,opacity 1s .5s;pointer-events:none}
.bq svg{display:block;width:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(74,44,29,.2));transform-origin:50% 92%}
.open .bq{opacity:1;transform:translateX(-50%)}
.settled .bq svg{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.1deg)}}
.env{position:absolute;left:62%;bottom:0;width:42%;aspect-ratio:3/2;z-index:4;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(50px) rotate(-6deg);transition:transform 1s cubic-bezier(.2,.9,.25,1),opacity .8s;filter:drop-shadow(0 8px 8px rgba(74,44,29,.28))}
.settled .env{opacity:1;pointer-events:auto;transform:translateX(-50%) rotate(-3deg);transition-delay:.6s}
.env::before{content:"";position:absolute;inset:0;background:#a97a4f;border-radius:3px}
.paper{position:absolute;left:8%;right:8%;top:10%;bottom:6%;z-index:2;background:#fffdf9 repeating-linear-gradient(transparent 0 7px,#ece0d2 7px 8px);box-shadow:0 0 4px rgba(0,0,0,.15);transition:transform 1s cubic-bezier(.3,.8,.3,1) .6s}
.env.open .paper{transform:translateY(-48%)}
.pocket{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;z-index:4;transform-origin:50% 0;background:linear-gradient(#cfa371,#bb8c5a);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .35s,filter .8s}
.env.open .flap{transform:perspective(600px) rotateX(180deg);z-index:1;filter:brightness(.9)}
.seal{position:absolute;left:50%;top:60%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6c4d2,#e08ba6);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;visibility:hidden;background:rgba(74,44,29,0);transition:background .6s,visibility 0s .7s}
.ov.show{visibility:visible;background:rgba(74,44,29,.5);transition:background .6s}
.sheet{position:relative;width:min(100%,430px);max-height:90dvh;overflow:auto;padding:40px 32px 34px;color:#000;background:#fff repeating-linear-gradient(transparent 0 31px,rgba(190,150,110,.2) 31px 32px);background-position:0 46px;border-radius:3px;box-shadow:0 20px 50px rgba(40,22,12,.4);opacity:0;transform:translateY(75vh) rotate(3deg);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .5s}
.show .sheet{opacity:1;transform:none}
.sheet p{margin:0 0 32px;font-size:1.32rem;font-weight:600;line-height:32px}
.sheet .hd,.sheet .sg{font-family:Caveat,cursive;font-weight:500;font-size:2rem;line-height:32px}
.sheet .sg{margin:0}
.x{position:absolute;top:6px;right:12px;font-size:1.9rem;line-height:1;color:#8a5e3c;padding:4px 8px}
@media(prefers-reduced-motion:reduce){.gift svg,.settled .bq svg{animation:none}}
</style>
</head>
<body>
<div class="top" id="top"><p id="title">Hasbi has something for you.</p><p id="hint">a little letter &mdash; tap to open</p></div>

<div class="stage" id="stage">
  <div class="bq"><svg id="bq" viewBox="0 0 300 340" aria-label="A bouquet of sunflowers, gerbera daisies, pink lilies, roses, baby's breath and goldenrod"></svg></div>

  <button class="gift" id="gift" aria-label="Tap to open the gift">
    <svg viewBox="0 0 300 260" aria-hidden="true">
      <defs>
        <linearGradient id="bx" x1="0" x2="1"><stop offset="0" stop-color="#d2ad86"/><stop offset=".55" stop-color="#c49b72"/><stop offset="1" stop-color="#b3875e"/></linearGradient>
        <linearGradient id="ld" x1="0" x2="1"><stop offset="0" stop-color="#dfbd9a"/><stop offset="1" stop-color="#cba57e"/></linearGradient>
        <linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#5c3827"/><stop offset=".5" stop-color="#4a2c1d"/><stop offset="1" stop-color="#3b2216"/></linearGradient>
      </defs>
      <ellipse cx="150" cy="246" rx="122" ry="9" fill="rgba(70,40,25,.2)"/>
      <rect x="42" y="112" width="216" height="128" rx="7" fill="url(#bx)"/>
      <rect x="136" y="112" width="28" height="128" fill="url(#rb)"/>
      <rect x="42" y="112" width="216" height="12" fill="rgba(60,30,15,.14)"/>
      <path d="M52 232H128M172 232H248" stroke="#e2c4a2" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7"/>
      <g class="lid">
        <rect x="32" y="82" width="236" height="38" rx="7" fill="url(#ld)"/>
        <path d="M44 92H126M174 92H256" stroke="#b58a62" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
        <rect x="136" y="82" width="28" height="38" fill="url(#rb)"/>
        <path d="M148 84L122 116H137L152 94Z" fill="#43271a"/><path d="M152 84L178 116H163L148 94Z" fill="#4a2c1d"/>
        <path d="M150 80C126 42 84 46 96 72 106 90 136 86 150 80Z" fill="#573424"/>
        <path d="M150 80C174 42 216 46 204 72 194 90 164 86 150 80Z" fill="#573424"/>
        <path d="M144 78C128 60 108 60 107 70M156 78C172 60 192 60 193 70" stroke="#80503a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="150" cy="80" rx="11" ry="9" fill="#4a2c1d"/><ellipse cx="147" cy="77" rx="4" ry="3" fill="#6b4331"/>
      </g>
    </svg>
  </button>

  <button class="env" id="env" aria-label="Tap to open the letter">
    <span class="paper"></span>
    <svg class="pocket" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0V200L150 108Z" fill="#c4965f"/><path d="M300 0V200L150 108Z" fill="#bd8f59"/><path d="M0 200H300L150 108Z" fill="#d1a672"/>
      <path d="M0 0L150 108L300 0M0 200L150 108L300 200" stroke="#a97a4f" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="flap"><i class="seal"></i></span>
  </button>
</div>

<div class="ov" id="ov" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Letter">
    <button class="x" id="x" aria-label="Close letter">&times;</button>
    <p class="hd">Dear Cayi,</p>
    <p>I hope you get enough time to enjoy the little things this week, and that nothing asks too much of you. I'm always happy to see you doing well. I love you.</p>
    <p class="sg">Lots of love,<br>Hasbi.</p>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const f=n=>n.toFixed(1);
const BY=252;
const G=(x,y,s,r,c)=>`<g transform="translate(${x} ${y}) rotate(${r||0}) scale(${s})">${c}</g>`;
const ring=(n,rx,ry,d,fill,o=0)=>{let r='';for(let i=0;i<n;i++)r+=`<ellipse cy="${-d}" rx="${rx}" ry="${ry}" fill="${fill}" transform="rotate(${o+i*360/n})"/>`;return r};
const qp=(x,y,t)=>{const cx=(150+x)/2,cy=(BY+y)/2+16,u=1-t;return[u*u*150+2*u*t*cx+t*t*x,u*u*BY+2*u*t*cy+t*t*y]};
const stem=(x,y,w=2.6,c='#557536')=>{const d=`M150 ${BY}Q${(150+x)/2} ${(BY+y)/2+16} ${x} ${y}`;return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#9bbb69" stroke-width="${f(w*.3)}" opacity=".45" stroke-linecap="round"/>`};
const lg=(id,y2,c)=>`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${y2}">${c.map((s,i)=>`<stop offset="${i/(c.length-1)}" stop-color="${s}"/>`).join('')}</linearGradient>`;
const rg=(id,a,b,c,cy=.5)=>`<radialGradient id="${id}" cx=".5" cy="${cy}" r=".62"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
const DEFS='<defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>'+
 '<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#3b2416" flood-opacity=".38"/></filter>'+
 '<linearGradient id="bs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-14"><stop offset="0" stop-color="#2a0c10" stop-opacity=".28"/><stop offset="1" stop-color="#2a0c10" stop-opacity="0"/></linearGradient>'+
 '<linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-56"><stop offset="0" stop-color="#cfe0a0"/><stop offset=".1" stop-color="#c42f6e"/><stop offset=".45" stop-color="#ee86b0"/><stop offset="1" stop-color="#fde8f0"/></linearGradient>'+
 lg('g0',-23,['#d9738f','#f4a6bb','#fde2ea'])+lg('g1',-23,['#a3123f','#e0245e','#f46f92'])+lg('g2',-23,['#e06400','#ff981a','#ffc652'])+lg('g3',-23,['#c94a08','#f2820f','#ffb24a'])+lg('g4',-23,['#7e0f34','#c21f58','#e8628a'])+
 lg('mt',-12,['#f6fcfd','#bfe6f0','#86cadd'])+lg('my',-12,['#f2bf10','#fddf4c','#fff5b8'])+lg('ma',-8,['#55308f','#8a5fc8','#c3a6ec'])+lg('mp',-7,['#a8357e','#d868ab','#f4acd2'])+
 rg('gd','#2a1c10','#4a3319','#7a5a28')+rg('rp','#d98655','#f4b98a','#fde6d0',.62)+rg('rq','#d98ea6','#f4bfce','#fde9ef',.62)+rg('rr','#dc7d40','#f3a566','#fbd2a4',.62)+
 '<linearGradient id="bdg" x1="0" x2="1"><stop offset="0" stop-color="#b9cf86"/><stop offset=".5" stop-color="#eef3cf"/><stop offset="1" stop-color="#b3ca7e"/></linearGradient><linearGradient id="kb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a97b47"/><stop offset="1" stop-color="#7d5830"/></linearGradient><linearGradient id="kl" x1="0" x2="1"><stop offset="0" stop-color="#dcb77f"/><stop offset="1" stop-color="#c9a06b"/></linearGradient><linearGradient id="kr" x1="0" x2="1"><stop offset="0" stop-color="#c9a06b"/><stop offset="1" stop-color="#b58850"/></linearGradient><linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9cdda"/><stop offset="1" stop-color="#eea6bb"/></linearGradient><linearGradient id="lf" x1="0" x2="1"><stop offset="0" stop-color="#4c6b2d"/><stop offset="1" stop-color="#7fa24e"/></linearGradient></defs>';
const pet=(l,w,k,a=0,tx=0)=>`M0 0C${f(-w*(1+a))} ${f(-l*.3)} ${f(-w*k*(1-a))} ${f(-l*.75)} ${f(tx)} ${f(-l)}C${f(w*k*(1+a))} ${f(-l*.75)} ${f(w*(1-a))} ${f(-l*.3)} 0 0Z`;
const petals=(n,l,w,k,fill,d,off,jit,st,sh)=>{let o='';for(let i=0;i<n;i++){const a=off+i*360/n+(rnd()-.5)*jit,L=l*(.88+rnd()*.2),as=(rnd()-.5)*.35,tx=(rnd()-.5)*w*.9,p=pet(L,w,k,as,tx);
  o+=`<g transform="rotate(${f(a)}) translate(0 ${-d})"><path d="${p}" fill="${fill}" stroke="${st}" stroke-width=".35"/>${sh?`<path d="${p}" fill="url(#${sh})"/>`:''}<path d="M0-1Q${f(tx*.5)} ${f(-L*.5)} ${f(tx*.9)} ${f(-L*.88)}" stroke="rgba(255,255,255,.3)" stroke-width=".45" fill="none"/><path d="M${f(-w*.4)} -2Q${f(-w*.5)} ${f(-L*.5)} ${f(tx*.5)} ${f(-L*.8)}M${f(w*.4)} -2Q${f(w*.5)} ${f(-L*.5)} ${f(tx*.5)} ${f(-L*.8)}" stroke="rgba(0,0,0,.12)" stroke-width=".3" fill="none"/></g>`}return o};
const leaf=(x,y,r,l,c)=>{const t=`C${f(l*.3)} ${f(-l*.34)} ${f(l*.75)} ${f(-l*.3)} ${l} 0`;return G(x,y,1,r,`<path d="M0 0${t}C${f(l*.75)} ${f(l*.3)} ${f(l*.3)} ${f(l*.34)} 0 0Z" fill="${c||'url(#lf)'}"/><path d="M0 0${t}Z" fill="rgba(255,255,255,.13)"/><path d="M0 0H${f(l*.92)}M${f(l*.3)} 0L${f(l*.55)} ${f(-l*.18)}M${f(l*.3)} 0L${f(l*.55)} ${f(l*.18)}" stroke="rgba(235,248,205,.4)" stroke-width=".6" fill="none"/>`)};
const SH=c=>`<g filter="url(#sh)">${c}</g>`;
const gerbera=(x,y,s,id,r)=>{const u=`url(#${id})`;let c='';
  for(let i=0;i<26;i++){const a=i*2.4,q=Math.sqrt(i)*1.35;c+=`<circle cx="${f(q*Math.cos(a))}" cy="${f(q*Math.sin(a))}" r="${f(.9+i*.015)}" fill="${i%2?'#e6c85a':'#b98a2c'}"/>`}
  return SH(G(x,y,s,r,petals(26,22,3.4,1.3,u,5,0,7,'rgba(0,0,0,.25)','bs')+petals(24,20.5,3.3,1.3,u,5,7,8,'rgba(0,0,0,.2)','bs')+petals(18,16,3.1,1.3,u,4.5,10,10,'rgba(0,0,0,.18)','bs')+
   '<circle r="8.6" fill="rgba(30,15,5,.5)"/><circle r="8" fill="url(#gd)"/>'+c+ring(14,.9,.9,6.9,'rgba(240,222,130,.9)')+'<circle r="1.6" fill="#7a4a22"/>'))};
const lily=(x,y,s,r)=>{const P='M0 0C-17-9-22-26-12-40C-9-45-6-49-4-52L0-56L4-52C6-49 9-45 12-40C22-26 17-9 0 0Z',L='M0 0C-17-9-22-26-12-40C-9-45-6-49-4-52L0-56Z',R='M0 0C17-9 22-26 12-40C9-45 6-49 4-52L0-56Z';let o='';
  for(const k of [1,3,5,0,2,4]){let sp='';for(let j=0;j<11;j++){const a=f((rnd()-.5)*10),b=f(-10-rnd()*28);sp+=`<circle cx="${a}" cy="${b}" r="${f(.7+rnd()*.7)}" fill="#8f1850"/><circle cx="${f(a-.25)}" cy="${f(b-.3)}" r=".3" fill="#f6a8c8"/>`}
    o+=`<g transform="rotate(${k*60}) scale(${k%2?.88:1})"><path d="${P}" fill="url(#lg)" stroke="#fbe1ea" stroke-width="1"/><path d="${L}" fill="rgba(90,0,45,.15)"/><path d="${R}" fill="rgba(255,255,255,.17)"/><path d="M0-3C-1-20 0-36 0-52" fill="none" stroke="#b01f5c" stroke-width="2.6" opacity=".4"/><path d="M-7-8C-10-24-6-40-2-50M7-8C10-24 6-40 2-50" fill="none" stroke="#c8467f" stroke-width=".9" opacity=".6"/>${sp}</g>`}
  for(let i=0;i<6;i++){const a=f(i*60+15+rnd()*10);o+=`<g transform="rotate(${a})"><path d="M0 0C3-10 5-20 3-29" fill="none" stroke="#efe0b5" stroke-width="1"/><ellipse cx="3" cy="-30" rx="2.2" ry="6" fill="#8a3a10" transform="rotate(10 3 -30)"/><path d="M2-35L3-26" stroke="#d9783a" stroke-width=".8"/><circle cx="5" cy="-33" r=".7" fill="#e89a40"/></g>`}
  o+='<path d="M0 0C-2-12-1-24 2-34" fill="none" stroke="#e4ecb0" stroke-width="1.5"/><circle cx="1.2" cy="-35" r="1.4" fill="#9bb35a"/><circle cx="3.4" cy="-34" r="1.4" fill="#9bb35a"/><circle cx="2.2" cy="-36.4" r="1.4" fill="#9bb35a"/><circle r="3" fill="#b7cf72"/>';
  return SH(`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s} ${f(s*.86)})">${o}</g>`)};
const bud=(x,y,s,r)=>SH(G(x,y,s,r,'<path d="M0 0C-9-8-10-26-6-34C-3-40 0-44 0-44C0-44 3-40 6-34C10-26 9-8 0 0Z" fill="url(#bdg)" stroke="#a9bd72" stroke-width=".6"/><path d="M0 0C-9-8-10-26-6-34C-3-40 0-44 0-44L0 0Z" fill="rgba(60,90,20,.12)"/><path d="M0 0V-42M-4-4C-6-18-4-30-1-40M4-4C6-18 4-30 1-40" stroke="#9fb468" stroke-width=".6" fill="none"/><path d="M-6-10C-9-22-7-32-3-38" stroke="#f0b4c8" stroke-width="1.4" fill="none" opacity=".6"/>'));
const rose=(x,y,s,id,dk)=>{const P='M-14 2C-17-10-6-18 2-17C13-16 18-6 14 4C10 13-8 15-14 2Z';let o='';
  for(let i=0;i<4;i++)o+=`<path d="M0 0C-3 7-2 15 0 22C2 15 3 7 0 0Z" fill="#587a35" transform="rotate(${i*90+45}) translate(0 10) scale(.55)"/>`;
  for(const[n,sc,off]of[[5,1,0],[5,.78,36],[4,.56,18],[3,.34,50]]){o+=`<circle r="${f(16*sc)}" fill="rgba(45,8,18,.3)"/>`;
    for(let i=0;i<n;i++)o+=`<g transform="rotate(${f(off+i*360/n+(rnd()-.5)*10)}) scale(${sc})"><path d="${P}" fill="url(#${id})" stroke="${dk}" stroke-width=".7"/><path d="M-12-6C-8-15 5-17 12-9" fill="none" stroke="#fff" stroke-width="1.3" opacity=".42" stroke-linecap="round"/><path d="M-13 3C-14 10-6 14 2 14" fill="none" stroke="${dk}" stroke-width="1" opacity=".35"/></g>`}
  return SH(G(x,y,s,0,o+`<path d="M-3 1C-3-4 3-4 3 0S0 3-1 1" fill="none" stroke="${dk}" stroke-width=".8"/>`))};

const sol=(x,y)=>{let o=stem(x,y,1.5,'#6c8a3c');
  for(let i=0;i<16;i++){const[px,py]=qp(x,y,.3+i*.043),w=4+13*(1-i/16);
    for(const sd of [-1,1]){const ex=px+sd*w,ey=py-4-rnd()*4;
      o+=`<path d="M${f(px)} ${f(py)}Q${f(px+sd*w*.5)} ${f(py-1)} ${f(ex)} ${f(ey)}" stroke="#7f9a44" stroke-width=".7" fill="none"/>`;
      for(let j=0;j<4;j++){const k=.3+j*.22,cx=px+(ex-px)*k,cy=py+(ey-py)*k;
        o+=`<path d="M${f(cx)} ${f(cy)}l${f(sd*3.2)} -2.4" stroke="#86a24a" stroke-width=".8" stroke-linecap="round"/>`+(j>1?`<circle cx="${f(cx+sd*1.5)}" cy="${f(cy-2.6)}" r="1.1" fill="#e9c431"/>`:'')}}}
  return o};

const st=$('#stage'),topBar=$('#top'),env=$('#env'),ov=$('#ov');
$('#gift').addEventListener('click',()=>{
  if(st.classList.contains('open'))return;
  st.classList.add('open');topBar.classList.add('o');
  setTimeout(()=>{st.classList.add('settled');topBar.classList.add('h')},2700);
});
const showLetter=()=>{ov.classList.add('show');ov.setAttribute('aria-hidden','false')};
const hideLetter=()=>{ov.classList.remove('show');ov.setAttribute('aria-hidden','true')};
env.addEventListener('click',()=>{
  topBar.classList.remove('h');
  if(env.classList.contains('open'))return showLetter();
  env.classList.add('open');setTimeout(showLetter,1900);
});
$('#x').addEventListener('click',hideLetter);
ov.addEventListener('click',e=>{if(e.target===ov)hideLetter()});
addEventListener('keydown',e=>{if(e.key==='Escape')hideLetter()});
